[project]
name = "data-science-lab-bicocca"
version = "0.1.0"
description = "Data Science Lab project — Bicocca semester 2"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "polars>=1.0",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "tqdm>=4.66",
    "duckdb>=1.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
analysis = [
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "plotly>=5.22",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "kaleido>=0.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
